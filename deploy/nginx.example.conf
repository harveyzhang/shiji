# 拾迹反向代理示例（nginx / openresty）。把 example.com 和证书路径换成你自己的；后端只监听 127.0.0.1:8025。
# 放在 Cloudflare 后面时，用 CF-Connecting-IP 作为真实访客 IP（后端按访客限流）；不用 Cloudflare 可直接用 $remote_addr。
# 一次调查最长一两分钟，读超时留到 150 秒；图片上限 8 MB，请求体上限放到 10 MB。
map $http_cf_connecting_ip $shiji_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
server {
    listen 80;
    listen 443 ssl;
    server_name example.com;
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    http2 on;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $shiji_client_ip;
        proxy_set_header X-Forwarded-For $shiji_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 150s;
    }
}
